<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoctorDocx</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <!-- Buttons for Sidebar and Loading Old Chats -->
    

    <div class="chat-container">
        
       <div class="semi-cont">
        <div class="left-buttons-container">
            <button id="old-chats-btn" onclick="openSidebar()">&#9782;</button>
            
        </div>
        <h1>DoctorDocx</h1>
        <div class="right-buttons-container">
            
            <button id="new-chat-btn" onclick="createNewChat()">+</button>
        </div>
       </div>
        <!-- Chat history display area -->
        <div id="chat-history" class="chat-history"></div>

        <!-- Form to submit new messages -->
        <form id="chat-form" class="chat-form">
            <textarea id="user-input" placeholder="Type your message..." rows="2" required></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
    <div id="long-button-container">
            
        <a href="/pdf">
            <button id="long-button">Add Data</button>
        </a>
          
    </div>

    <!-- Sidebar for old chats -->
    <div id="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeSidebar()">×</a>
        <h2 style="color: #fff; padding-left: 30px;">Chat History</h2>
        <div id="old-chats-list"></div>
    </div>

    <script src="../static/fucn.js"></script>
</body>
</html>
